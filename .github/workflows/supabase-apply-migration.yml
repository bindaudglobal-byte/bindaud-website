name: Apply Supabase Migration

on:
  workflow_dispatch:

jobs:
  apply-migration:
    runs-on: ubuntu-latest
    env:
      MIGRATION_FILE: supabase/migrations/20260813_add_orders_and_order_items.sql
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install psql client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Apply migration
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Missing SUPABASE_DB_URL secret. Please add it in repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "Applying $MIGRATION_FILE to the database"
          psql "$DATABASE_URL" -f "$MIGRATION_FILE"
